name: Link check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Mondays, catches external rot

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir resolves root-relative links (/security/foo) against the
          #   VitePress srcDir. It must be an absolute path.
          # --fallback-extensions md lets extensionless links find their .md file.
          # --offline skips network calls, so external hosts can't make this flaky.
          args: >-
            --offline
            --root-dir "${{ github.workspace }}/docs"
            --fallback-extensions md
            --no-progress
            'docs/**/*.md'
          fail: true
          