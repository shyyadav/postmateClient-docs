<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Postmate Client side-by-side API response comparison</title>
  <desc id="heroDesc">Two API response panels shown side by side with differences highlighted, surrounded by a local privacy shield and the VS Code editor frame.</desc>

  <defs>
    <style>
      .bg { fill: #FAFAF7; }
      .panel { fill: #FFFFFF; stroke: #E5E5E0; stroke-width: 1; }
      .panel-header { fill: #F4F4EE; }
      .text-primary { fill: #1F1F1C; font-family: 'Inter', system-ui, sans-serif; font-weight: 500; }
      .text-secondary { fill: #6B6B65; font-family: 'Inter', system-ui, sans-serif; font-weight: 400; }
      .code { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; font-weight: 400; }
      .key { fill: #8B5CF6; }
      .string { fill: #16A34A; }
      .number { fill: #2563EB; }
      .punct { fill: #6B6B65; }
      .diff-removed { fill: #FEE2E2; }
      .diff-added { fill: #DCFCE7; }
      .badge-prod { fill: #DBEAFE; stroke: #2563EB; stroke-width: 1; }
      .badge-staging { fill: #FEF3C7; stroke: #D97706; stroke-width: 1; }
      .badge-text-prod { fill: #1E40AF; font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 10px; }
      .badge-text-staging { fill: #92400E; font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 10px; }
      .shield { fill: none; stroke: #16A34A; stroke-width: 1.5; }
      .shield-bg { fill: #F0FDF4; stroke: #16A34A; stroke-width: 1; }
      .traffic-r { fill: #EF4444; }
      .traffic-y { fill: #F59E0B; }
      .traffic-g { fill: #22C55E; }
      .arrow { fill: none; stroke: #8B5CF6; stroke-width: 1.5; stroke-dasharray: 4 3; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #1F1F1C; }
        .panel { fill: #2A2A26; stroke: #3A3A35; }
        .panel-header { fill: #232320; }
        .text-primary { fill: #F4F4EE; }
        .text-secondary { fill: #A8A8A2; }
        .key { fill: #C084FC; }
        .string { fill: #4ADE80; }
        .number { fill: #60A5FA; }
        .punct { fill: #A8A8A2; }
        .diff-removed { fill: #4C1D1D; }
        .diff-added { fill: #14532D; }
        .badge-prod { fill: #1E3A8A; stroke: #60A5FA; }
        .badge-staging { fill: #78350F; stroke: #FBBF24; }
        .badge-text-prod { fill: #DBEAFE; }
        .badge-text-staging { fill: #FEF3C7; }
        .shield-bg { fill: #14532D; stroke: #4ADE80; }
        .shield { stroke: #4ADE80; }
      }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer VS Code-ish window -->
  <rect class="panel" x="20" y="20" width="640" height="420" rx="10"/>
  <rect class="panel-header" x="20" y="20" width="640" height="32" rx="10"/>
  <rect class="panel-header" x="20" y="42" width="640" height="10"/>

  <!-- Traffic lights -->
  <circle class="traffic-r" cx="40" cy="36" r="5"/>
  <circle class="traffic-y" cx="56" cy="36" r="5"/>
  <circle class="traffic-g" cx="72" cy="36" r="5"/>

  <!-- Tab title -->
  <text class="text-secondary code" x="340" y="40" font-size="11" text-anchor="middle">postmate-client • compare responses</text>

  <!-- Privacy shield top-right -->
  <g transform="translate(605, 30)">
    <rect class="shield-bg" x="0" y="0" width="44" height="18" rx="9"/>
    <path class="shield" d="M9 9 L 11 11 L 15 7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text class="text-primary" x="20" y="13" font-size="9" font-weight="500" fill="#16A34A">Local</text>
  </g>

  <!-- Toolbar with request -->
  <rect class="panel-header" x="40" y="68" width="600" height="36" rx="6"/>
  <rect x="52" y="78" width="42" height="16" rx="3" fill="#16A34A"/>
  <text class="code" x="73" y="89" font-size="10" fill="#FFFFFF" font-weight="500" text-anchor="middle">GET</text>
  <text class="code text-primary" x="104" y="89" font-size="11">/api/v1/users/42</text>
  <rect x="560" y="76" width="68" height="20" rx="4" fill="#8B5CF6"/>
  <text class="text-primary" x="594" y="89" font-size="10" fill="#FFFFFF" font-weight="500" text-anchor="middle">Compare</text>

  <!-- LEFT panel: Production -->
  <g transform="translate(40, 120)">
    <rect class="panel" x="0" y="0" width="290" height="290" rx="6"/>
    <rect class="panel-header" x="0" y="0" width="290" height="28" rx="6"/>
    <rect class="panel-header" x="0" y="22" width="290" height="6"/>

    <!-- env badge -->
    <rect class="badge-prod" x="12" y="7" width="58" height="16" rx="8"/>
    <text class="badge-text-prod" x="41" y="18" text-anchor="middle">PROD</text>
    <text class="text-secondary code" x="84" y="18" font-size="10">200 OK · 142ms</text>

    <!-- JSON content -->
    <g font-size="11" class="code">
      <text class="punct" x="14" y="50">{</text>
      <text x="26" y="68"><tspan class="key">"id"</tspan><tspan class="punct">: </tspan><tspan class="number">42</tspan><tspan class="punct">,</tspan></text>
      <text x="26" y="86"><tspan class="key">"name"</tspan><tspan class="punct">: </tspan><tspan class="string">"Ada Lovelace"</tspan><tspan class="punct">,</tspan></text>

      <!-- diff row: email -->
      <rect class="diff-removed" x="20" y="92" width="260" height="18" rx="3"/>
      <text x="26" y="105"><tspan class="key">"email"</tspan><tspan class="punct">: </tspan><tspan class="string">"ada@old.com"</tspan><tspan class="punct">,</tspan></text>

      <text x="26" y="123"><tspan class="key">"role"</tspan><tspan class="punct">: </tspan><tspan class="string">"admin"</tspan><tspan class="punct">,</tspan></text>

      <!-- diff row: plan -->
      <rect class="diff-removed" x="20" y="129" width="260" height="18" rx="3"/>
      <text x="26" y="142"><tspan class="key">"plan"</tspan><tspan class="punct">: </tspan><tspan class="string">"pro"</tspan><tspan class="punct">,</tspan></text>

      <text x="26" y="160"><tspan class="key">"verified"</tspan><tspan class="punct">: </tspan><tspan class="number">true</tspan><tspan class="punct">,</tspan></text>

      <!-- diff row: credits -->
      <rect class="diff-removed" x="20" y="166" width="260" height="18" rx="3"/>
      <text x="26" y="179"><tspan class="key">"credits"</tspan><tspan class="punct">: </tspan><tspan class="number">1200</tspan><tspan class="punct">,</tspan></text>

      <text x="26" y="197"><tspan class="key">"region"</tspan><tspan class="punct">: </tspan><tspan class="string">"us-east"</tspan></text>
      <text class="punct" x="14" y="215">}</text>
    </g>
  </g>

  <!-- RIGHT panel: Staging -->
  <g transform="translate(350, 120)">
    <rect class="panel" x="0" y="0" width="290" height="290" rx="6"/>
    <rect class="panel-header" x="0" y="0" width="290" height="28" rx="6"/>
    <rect class="panel-header" x="0" y="22" width="290" height="6"/>

    <rect class="badge-staging" x="12" y="7" width="74" height="16" rx="8"/>
    <text class="badge-text-staging" x="49" y="18" text-anchor="middle">STAGING</text>
    <text class="text-secondary code" x="100" y="18" font-size="10">200 OK · 138ms</text>

    <g font-size="11" class="code">
      <text class="punct" x="14" y="50">{</text>
      <text x="26" y="68"><tspan class="key">"id"</tspan><tspan class="punct">: </tspan><tspan class="number">42</tspan><tspan class="punct">,</tspan></text>
      <text x="26" y="86"><tspan class="key">"name"</tspan><tspan class="punct">: </tspan><tspan class="string">"Ada Lovelace"</tspan><tspan class="punct">,</tspan></text>

      <rect class="diff-added" x="20" y="92" width="260" height="18" rx="3"/>
      <text x="26" y="105"><tspan class="key">"email"</tspan><tspan class="punct">: </tspan><tspan class="string">"ada@new.com"</tspan><tspan class="punct">,</tspan></text>

      <text x="26" y="123"><tspan class="key">"role"</tspan><tspan class="punct">: </tspan><tspan class="string">"admin"</tspan><tspan class="punct">,</tspan></text>

      <rect class="diff-added" x="20" y="129" width="260" height="18" rx="3"/>
      <text x="26" y="142"><tspan class="key">"plan"</tspan><tspan class="punct">: </tspan><tspan class="string">"enterprise"</tspan><tspan class="punct">,</tspan></text>

      <text x="26" y="160"><tspan class="key">"verified"</tspan><tspan class="punct">: </tspan><tspan class="number">true</tspan><tspan class="punct">,</tspan></text>

      <rect class="diff-added" x="20" y="166" width="260" height="18" rx="3"/>
      <text x="26" y="179"><tspan class="key">"credits"</tspan><tspan class="punct">: </tspan><tspan class="number">1500</tspan><tspan class="punct">,</tspan></text>

      <text x="26" y="197"><tspan class="key">"region"</tspan><tspan class="punct">: </tspan><tspan class="string">"us-east"</tspan></text>
      <text class="punct" x="14" y="215">}</text>
    </g>
  </g>

  <!-- Diff connectors between panels -->
  <line x1="305" y1="221" x2="365" y2="221" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="305" y1="258" x2="365" y2="258" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="305" y1="295" x2="365" y2="295" class="arrow" marker-end="url(#arrowHead)"/>

  <!-- Bottom status bar -->
  <rect class="panel-header" x="20" y="420" width="640" height="20" rx="0"/>
  <text class="text-secondary code" x="40" y="434" font-size="10">3 differences</text>
  <text class="text-secondary code" x="340" y="434" font-size="10" text-anchor="middle">no telemetry · no cloud · 100% local</text>
  <text class="text-secondary code" x="640" y="434" font-size="10" text-anchor="end">Postmate Client</text>
</svg>
